<title>.Txt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg-color: #ffffff;
  --text-color: #1e1e1e;
  --muted-color: #888888;
  --border-color: #e5e5e5;
  --accent-color: #00ffc3;
  --font-family: Georgia, serif;
}

body.dark {
  --bg-color: #12161f;
  --text-color: #e0e6ed;
  --muted-color: #607080;
  --border-color: rgba(255, 255, 255, 0.08);
}

body.code-mode {
  --font-family: 'JetBrains Mono', monospace;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-family);
  background: var(--bg-color);
  color: var(--text-color);
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: background 0.25s ease, color 0.25s ease;
}

header {
  padding: 0.8rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
}

.brand {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 1.05rem;
  text-decoration: none;
  color: var(--text-color);
  letter-spacing: -0.5px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 0.3rem;
}

/* Minimal Buttons */
.btn {
  background: transparent;
  border: none;
  color: var(--muted-color);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  padding: 0.35rem 0.65rem;
  border-radius: 4px;
  cursor: pointer;
  transition: color 0.2s ease, background 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
}

.btn:hover {
  color: var(--text-color);
  background: rgba(128, 128, 128, 0.1);
}

.btn.active {
  color: var(--accent-color);
}

.mode-toggle {
  background: rgba(128, 128, 128, 0.08);
  border: 1px solid var(--border-color);
  padding: 0.2rem;
  border-radius: 6px;
  display: flex;
  gap: 0.2rem;
}

.mode-btn {
  background: transparent;
  border: none;
  color: var(--muted-color);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  padding: 0.25rem 0.55rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.mode-btn.active {
  background: var(--text-color);
  color: var(--bg-color);
  font-weight: 600;
}

.editor-container {
  flex-grow: 1;
  width: 85%;
  max-width: 820px;
  margin: 1.5rem auto;
  display: flex;
  flex-direction: column;
  position: relative;
}

#editor {
  flex-grow: 1;
  width: 100%;
  height: 100%;
  padding: 1rem 0;
  background: transparent;
  color: var(--text-color);
  border: none;
  outline: none;
  overflow-y: auto;
  line-height: 1.6;
  font-size: 1.1rem;
  font-family: var(--font-family);
  white-space: pre-wrap;
  word-break: break-word;
}

#editor:empty::before {
  content: attr(data-placeholder);
  color: var(--muted-color);
  pointer-events: none;
}

footer {
  padding: 0.5rem 1.5rem;
  border-top: 1px solid var(--border-color);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  color: var(--muted-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-left {
  display: flex;
  gap: 1.2rem;
  align-items: center;
}

.pos-indicator {
  color: var(--text-color);
  font-weight: 500;
}

.code-badge {
  display: none;
  font-size: 0.7rem;
  color: var(--accent-color);
  background: rgba(0, 255, 195, 0.1);
  padding: 0.1rem 0.4rem;
  border-radius: 3px;
}

body.code-mode .code-badge {
  display: inline-block;
}

@media (max-width: 640px) {
  header, footer {
    padding: 0.6rem 1rem;
  }
  .editor-container {
    width: 92%;
    margin: 0.8rem auto;
  }
}
</style>
</head>
<body class="dark">

<header>
  <a href="/" class="brand">.Txt</a>

  <div class="controls">
    <div class="mode-toggle">
      <button class="mode-btn active" id="textModeBtn">Text</button>
      <button class="mode-btn" id="codeModeBtn">Code</button>
    </div>
    
    <button class="btn" id="themeBtn" title="Toggle theme">☀️ Light</button>
    <button class="btn" id="downloadBtn" title="Save file">Save</button>
    <button class="btn" id="clearBtn" title="Clear text">Clear</button>
  </div>
</header>

<div class="editor-container">
  <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start typing here..."></div>
</div>

<footer>
  <div class="footer-left">
    <span class="pos-indicator" id="posIndicator">Ln 1, Col 1</span>
    <span id="charCount">0 chars</span>
    <span id="wordCount">0 words</span>
    <span class="code-badge">CODE MODE</span>
  </div>
  <div>Auto-saved</div>
</footer>

<script>
const editor = document.getElementById('editor');
const themeBtn = document.getElementById('themeBtn');
const textModeBtn = document.getElementById('textModeBtn');
const codeModeBtn = document.getElementById('codeModeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const clearBtn = document.getElementById('clearBtn');
const posIndicator = document.getElementById('posIndicator');
const charCount = document.getElementById('charCount');
const wordCount = document.getElementById('wordCount');

let isCodeMode = false;
let isDark = true;

// Load saved content & settings
const savedText = localStorage.getItem('tako_txt_content');
if (savedText) {
  editor.innerText = savedText;
  updateStats();
}

const savedMode = localStorage.getItem('tako_txt_mode');
if (savedMode === 'code') setMode(true);

// Mode Toggle
textModeBtn.addEventListener('click', () => setMode(false));
codeModeBtn.addEventListener('click', () => setMode(true));

function setMode(code) {
  isCodeMode = code;
  document.body.classList.toggle('code-mode', isCodeMode);
  textModeBtn.classList.toggle('active', !isCodeMode);
  codeModeBtn.classList.toggle('active', isCodeMode);
  editor.setAttribute('spellcheck', !isCodeMode);
  editor.dataset.placeholder = isCodeMode ? "// Code editor mode (WIP)\nfunction hello() {\n  console.log('world');\n}" : "Start typing here...";
  localStorage.setItem('tako_txt_mode', isCodeMode ? 'code' : 'text');
}

// Tab key intercept for Code Mode
editor.addEventListener('keydown', (e) => {
  if (isCodeMode && e.key === 'Tab') {
    e.preventDefault();
    document.execCommand('insertText', false, '  ');
  }
});

// Auto save, stats & position update
['input', 'keyup', 'mouseup', 'click', 'focus'].forEach(evt => {
  editor.addEventListener(evt, () => {
    updateStats();
    updateCursorPos();
    if (evt === 'input') {
      localStorage.setItem('tako_txt_content', editor.innerText);
    }
  });
});

document.addEventListener('selectionchange', () => {
  if (document.activeElement === editor) {
    updateCursorPos();
  }
});

function updateStats() {
  const text = editor.innerText.trim();
  const chars = editor.innerText.length;
  const words = text ? text.split(/\s+/).length : 0;
  charCount.textContent = `${chars} char${chars !== 1 ? 's' : ''}`;
  wordCount.textContent = `${words} word${words !== 1 ? 's' : ''}`;
}

function updateCursorPos() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  
  const textBefore = getTextBeforeRange(editor, range);
  const lines = textBefore.split('\n');
  const lineNum = lines.length;
  const colNum = lines[lines.length - 1].length + 1;

  posIndicator.textContent = `Ln ${lineNum}, Col ${colNum}`;
}

function getTextBeforeRange(container, range) {
  const preRange = range.cloneRange();
  preRange.selectNodeContents(container);
  preRange.setEnd(range.startContainer, range.startOffset);
  return preRange.toString();
}

// Theme toggle
themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  themeBtn.textContent = isDark ? '☀️ Light' : '🌙 Dark';
});

// Download .txt / code file
downloadBtn.addEventListener('click', () => {
  const text = editor.innerText;
  if (!text) return;
  const ext = isCodeMode ? 'js' : 'txt';
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `file-${new Date().toISOString().slice(0,10)}.${ext}`;
  a.click();
  URL.revokeObjectURL(url);
});

// Clear
clearBtn.addEventListener('click', () => {
  if (confirm('Clear editor content?')) {
    editor.innerText = '';
    localStorage.removeItem('tako_txt_content');
    updateStats();
    updateCursorPos();
  }
});

updateCursorPos();
</script>

</body>
</html>
