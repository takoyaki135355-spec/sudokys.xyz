<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/admin/assets/favicon.png">
<title>.Txt Editor | tako@sudokys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Catppuccin Latte (light) */
  --bg-color: #eff1f5;
  --card-bg: #e6e9ef;
  --text-color: #4c4f69;
  --muted-color: #8c8fa1;
  --border-color: #ccd0da;
  --accent-color: #40a02b;
  --font-family: Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Outfit', sans-serif;
}
body.dark {
  /* Catppuccin Mocha (dark) */
  --bg-color: #1e1e2e;
  --card-bg: #181825;
  --text-color: #cdd6f4;
  --muted-color: #a6adc8;
  --border-color: #313244;
  --accent-color: #a6e3a1;
}
body.code-mode {
  --font-family: 'JetBrains Mono', monospace;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: var(--font-family);
  background: var(--bg-color);
  color: var(--text-color);
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: background 0.25s ease, color 0.25s ease;
}
header {
  padding: 0.8rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  background: var(--card-bg);
}
.brand {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 1.05rem;
  text-decoration: none;
  color: var(--text-color);
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.brand .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-color);
}
.controls {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
/* Minimal Buttons */
.btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted-color);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.35rem 0.65rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  letter-spacing: 0.5px;
}
.btn:hover {
  color: var(--text-color);
  background: rgba(128, 128, 128, 0.12);
  border-color: var(--border-color);
}
.btn.active {
  color: var(--accent-color);
}
.mode-toggle {
  background: rgba(128, 128, 128, 0.08);
  border: 1px solid var(--border-color);
  padding: 0.2rem;
  border-radius: 4px;
  display: flex;
  gap: 0.2rem;
}
.mode-btn {
  background: transparent;
  border: none;
  color: var(--muted-color);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.mode-btn.active {
  background: var(--accent-color);
  color: #11111b;
  font-weight: 700;
}
.editor-container {
  flex-grow: 1;
  width: 88%;
  max-width: 850px;
  margin: 1.5rem auto;
  display: flex;
  flex-direction: column;
  position: relative;
}
#editor {
  flex-grow: 1;
  width: 100%;
  height: 100%;
  padding: 1rem 0;
  background: transparent;
  color: var(--text-color);
  border: none;
  outline: none;
  overflow-y: auto;
  line-height: 1.65;
  font-size: 1.12rem;
  font-family: var(--font-family);
  white-space: pre-wrap;
  word-break: break-word;
}
#editor:empty::before {
  content: attr(data-placeholder);
  color: var(--muted-color);
  pointer-events: none;
  opacity: 0.6;
}
body.code-mode #editor {
  display: none;
}
.lang-selector {
  display: none;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  color: var(--text-color);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  outline: none;
}
body.code-mode .lang-selector {
  display: block;
}
.CodeMirror {
  display: none;
  height: 100%;
  font-family: var(--font-mono);
  font-size: 1.05rem;
  background: transparent !important;
}
body.code-mode .CodeMirror {
  display: block;
  flex-grow: 1;
}
.CodeMirror-hints {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  background: var(--bg-color) !important;
  border: 1px solid var(--border-color) !important;
  border-radius: 6px !important;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2) !important;
  padding: 4px 0 !important;
  color: var(--text-color) !important;
  overflow: hidden;
}
.CodeMirror-hint {
  padding: 6px 12px !important;
  color: var(--text-color) !important;
  border-radius: 0 !important;
  cursor: pointer;
}
.CodeMirror-hint-active {
  background: var(--accent-color) !important;
  color: #11111b !important;
  font-weight: 600;
}
body.dark .CodeMirror-hint-active {
  color: #11111b !important;
}
/* Theme Integration Overrides */
body.dark .CodeMirror-gutters {
  background: transparent !important;
  border-right: 1px solid var(--border-color) !important;
}
body.dark .CodeMirror-linenumber {
  color: var(--muted-color) !important;
}
body.dark .CodeMirror-cursor {
  border-left: 2px solid var(--accent-color) !important;
}
body.dark .CodeMirror-selected {
  background: rgba(88, 91, 112, 0.45) !important;
}
/* Syntax Highlighting — Catppuccin Mocha */
body.dark .cm-s-dracula.CodeMirror { background: transparent !important; color: #cdd6f4 !important; }
body.dark .cm-s-dracula .cm-variable { color: #cdd6f4 !important; }
body.dark .cm-s-dracula .cm-builtin { color: #89dceb !important; font-weight: 500; }
body.dark .cm-s-dracula .cm-keyword { color: #cba6f7 !important; font-weight: 600; }
body.dark .cm-s-dracula .cm-def { color: #89b4fa !important; }
body.dark .cm-s-dracula .cm-string { color: #a6e3a1 !important; }
body.dark .cm-s-dracula .cm-number { color: #fab387 !important; }
body.dark .cm-s-dracula .cm-operator { color: #94e2d5 !important; }
body.dark .cm-s-dracula .cm-comment { color: #6c7086 !important; font-style: italic; }
body.dark .cm-s-dracula .cm-property { color: #74c7ec !important; }
body.dark .cm-s-dracula .cm-atom { color: #fab387 !important; }
body.dark .cm-s-dracula .cm-tag { color: #f38ba8 !important; }
body.dark .cm-s-dracula .cm-meta { color: #f5c2e7 !important; font-weight: 600; }
body.dark .cm-s-dracula .cm-type { color: #f9e2af !important; }
body.dark .cm-s-dracula .cm-variable-2 { color: #f9e2af !important; }

/* Syntax Highlighting — Catppuccin Latte */
body:not(.dark) .cm-s-default.CodeMirror { background: transparent !important; color: #4c4f69 !important; }
body:not(.dark) .CodeMirror-gutters { background: transparent !important; border-right: 1px solid var(--border-color) !important; }
body:not(.dark) .CodeMirror-linenumber { color: var(--muted-color) !important; }
body:not(.dark) .cm-s-default .cm-variable { color: #4c4f69 !important; }
body:not(.dark) .cm-s-default .cm-builtin { color: #04a5e5 !important; font-weight: 500; }
body:not(.dark) .cm-s-default .cm-keyword { color: #8839ef !important; font-weight: 600; }
body:not(.dark) .cm-s-default .cm-def { color: #1e66f5 !important; }
body:not(.dark) .cm-s-default .cm-string { color: #40a02b !important; }
body:not(.dark) .cm-s-default .cm-number { color: #fe640b !important; }
body:not(.dark) .cm-s-default .cm-operator { color: #179299 !important; }
body:not(.dark) .cm-s-default .cm-comment { color: #8c8fa1 !important; font-style: italic; }
body:not(.dark) .cm-s-default .cm-property { color: #209fb5 !important; }
body:not(.dark) .cm-s-default .cm-tag { color: #d20f39 !important; }
body:not(.dark) .cm-s-default .cm-meta { color: #ea76cb !important; font-weight: 600; }
body:not(.dark) .cm-s-default .cm-type { color: #df8e1d !important; }
body:not(.dark) .cm-s-default .cm-variable-2 { color: #df8e1d !important; }

footer {
  padding: 0.65rem 1.5rem;
  border-top: 1px solid var(--border-color);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--muted-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card-bg);
}
.footer-left {
  display: flex;
  gap: 1.2rem;
  align-items: center;
}
.pos-indicator {
  color: var(--muted-color);
}
.code-indicator {
  display: none;
  color: var(--accent-color);
  font-size: 0.78rem;
  font-weight: 600;
}
body.code-mode .code-indicator {
  display: inline;
}
.toast {
  position: fixed;
  bottom: 2.2rem;
  right: 2rem;
  background: var(--card-bg);
  color: var(--text-color);
  border: 1px solid var(--border-color);
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 600;
  padding: 0.6rem 1.1rem;
  border-radius: 6px;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 100;
  pointer-events: none;
}
.toast.show {
  transform: translateY(0);
  opacity: 1;
}
@media (max-width: 640px) {
  header, footer {
    padding: 0.6rem 1rem;
  }
  .editor-container {
    width: 92%;
    margin: 0.8rem auto;
  }
}
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/ruby/ruby.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/anyword-hint.min.js"></script>
</head>
<body class="dark">
<header>
  <a href="/" class="brand">
    <span class="dot"></span>
    <span>.Txt Editor</span>
  </a>
  <div class="controls">
    <div class="mode-toggle">
      <button class="mode-btn active" id="textModeBtn">Text</button>
      <button class="mode-btn" id="codeModeBtn">Code</button>
    </div>
    
    <select id="langSelector" class="lang-selector">
      <option value="python">Python</option>
      <option value="json">JSON</option>
      <option value="cpp">C++</option>
      <option value="ruby">Ruby</option>
    </select>
    
    <button class="btn" id="formatBtn" title="Format code (JSON/Python)">[FORMAT]</button>
    <button class="btn" id="themeBtn" title="Toggle theme">Light</button>
    <button class="btn" id="downloadBtn" title="Save file">[SAVE]</button>
    <button class="btn" id="clearBtn" title="Clear text">[CLEAR]</button>
  </div>
</header>
<div class="editor-container">
  <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start typing your notes here...">The quick brown fox jumps over the lazy dog.</div>
  <textarea id="codeEditor"></textarea>
</div>
<div class="toast" id="toast"></div>
<footer>
  <div class="footer-left">
    <span class="pos-indicator" id="posIndicator">Ln 1, Col 1</span>
    <span id="charCount">0 chars</span>
    <span id="wordCount">0 words</span>
    <span class="code-indicator">&lt;/&gt;</span>
  </div>
  <div>Auto-saved</div>
</footer>
<script>
const editor = document.getElementById('editor');
const codeEditorTextarea = document.getElementById('codeEditor');
const langSelector = document.getElementById('langSelector');
const formatBtn = document.getElementById('formatBtn');
const themeBtn = document.getElementById('themeBtn');
const textModeBtn = document.getElementById('textModeBtn');
const codeModeBtn = document.getElementById('codeModeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const clearBtn = document.getElementById('clearBtn');
const posIndicator = document.getElementById('posIndicator');
const charCount = document.getElementById('charCount');
const wordCount = document.getElementById('wordCount');
const toast = document.getElementById('toast');

let isCodeMode = false;
let isDark = true;

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2200);
}

const cm = CodeMirror.fromTextArea(codeEditorTextarea, {
  lineNumbers: true,
  mode: 'python',
  theme: 'dracula',
  autoCloseBrackets: true,
  matchBrackets: true,
  extraKeys: {
    "Ctrl-Space": "autocomplete"
  }
});

function applyLanguage(lang) {
  if (lang === 'json') {
    cm.setOption('mode', { name: 'javascript', json: true });
  } else if (lang === 'cpp') {
    cm.setOption('mode', 'text/x-c++src');
  } else {
    cm.setOption('mode', 'python');
  }
  localStorage.setItem('tako_txt_lang', lang);
}

langSelector.addEventListener('change', () => {
  applyLanguage(langSelector.value);
  showToast(`Language: ${langSelector.value.toUpperCase()}`);
});

cm.on("inputRead", function(instance, change) {
  if (change.text[0].match(/[\w"#<.:]/)) {
    cm.showHint({
      hint: function(editor, options) {
        const cur = editor.getCursor();
        const token = editor.getTokenAt(cur);
        const mode = editor.getOption('mode');
        const modeName = typeof mode === 'object' ? mode.name : mode;

        if (modeName === 'text/x-c++src' || mode === 'text/x-c++src' || langSelector.value === 'cpp') {
          const cppKeywords = [
            '#include', '#define', '#pragma', '#ifdef', '#ifndef', '#endif',
            'int', 'void', 'double', 'float', 'char', 'bool', 'auto', 'const', 'constexpr',
            'class', 'struct', 'public', 'private', 'protected', 'return', 'using', 'namespace',
            'std::cout', 'std::cin', 'std::endl', 'std::string', 'std::vector', 'std::map',
            'std::unordered_map', 'std::shared_ptr', 'std::unique_ptr', 'std::make_shared',
            'std::make_unique', 'main', 'nullptr', 'true', 'false', 'template', 'typename',
            'virtual', 'override', 'size_t', 'uint32_t', 'int64_t', 'include', 'string', 'vector'
          ];
          const word = token.string;
          const list = cppKeywords.filter(k => k.toLowerCase().startsWith(word.toLowerCase()));

          const anywordResult = CodeMirror.hint.anyword(editor, options);
          if (anywordResult && anywordResult.list) {
            anywordResult.list.forEach(w => {
              if (!list.includes(w)) list.push(w);
            });
          }
          return {
            list: list.length > 0 ? list : (anywordResult ? anywordResult.list : []),
            from: CodeMirror.Pos(cur.line, token.start),
            to: CodeMirror.Pos(cur.line, token.end)
          };
        } else if ((typeof mode === 'object' && mode.json) || mode === 'json') {
          const jsonKeywords = ['true', 'false', 'null'];
          const word = token.string.replace(/^"/, '');
          const list = jsonKeywords.filter(k => k.startsWith(word.toLowerCase()));
          
          const anywordResult = CodeMirror.hint.anyword(editor, options);
          if (anywordResult && anywordResult.list) {
            anywordResult.list.forEach(w => {
              if (!list.includes(w)) list.push(w);
            });
          }
          return {
            list: list.length > 0 ? list : (anywordResult ? anywordResult.list : []),
            from: CodeMirror.Pos(cur.line, token.start),
            to: CodeMirror.Pos(cur.line, token.end)
          };
        }
        return CodeMirror.hint.anyword(editor, options);
      },
      completeSingle: false
    });
  }
});

// Formatting handler for JSON, C++, and Python
function formatCode() {
  const lang = langSelector.value;
  
  if (!isCodeMode) {
    const text = editor.innerText.trim();
    if (!text) return;
    if (lang === 'json') {
      try {
        const parsed = JSON.parse(text);
        editor.innerText = JSON.stringify(parsed, null, 2);
        localStorage.setItem('tako_txt_content', editor.innerText);
        updateStats();
        showToast('JSON Formatted!');
      } catch(e) {
        showToast('Invalid JSON: ' + e.message);
      }
    } else {
      showToast('Switch to Code mode to format ' + lang.toUpperCase());
    }
    return;
  }

  const code = cm.getValue();
  if (!code.trim()) return;

  if (lang === 'json') {
    try {
      const parsed = JSON.parse(code);
      const formatted = JSON.stringify(parsed, null, 2);
      cm.setValue(formatted);
      localStorage.setItem('tako_txt_content', formatted);
      showToast('JSON Formatted!');
    } catch (err) {
      showToast('Invalid JSON: ' + err.message);
    }
  } else if (lang === 'cpp') {
    const totalLines = cm.lineCount();
    for (let i = 0; i < totalLines; i++) {
      cm.indentLine(i, "smart");
    }
    const formatted = cm.getValue().split('\n').map(l => l.trimEnd()).join('\n');
    cm.setValue(formatted);
    localStorage.setItem('tako_txt_content', formatted);
    showToast('C++ Formatted!');
  } else {
    // Python cleanup
    const lines = code.split('\n').map(l => l.trimEnd());
    const formatted = lines.join('\n');
    cm.setValue(formatted);
    localStorage.setItem('tako_txt_content', formatted);
    showToast('Python Formatted!');
  }
}

formatBtn.addEventListener('click', formatCode);

// Restore saved language
const savedLang = localStorage.getItem('tako_txt_lang');
if (savedLang) {
  langSelector.value = savedLang;
  applyLanguage(savedLang);
}

cm.on('change', () => {
  if (!isCodeMode) return;
  const val = cm.getValue();
  localStorage.setItem('tako_txt_content', val);
  updateStats();
});

cm.on('cursorActivity', () => {
  if (!isCodeMode) return;
  const cursor = cm.getCursor();
  posIndicator.textContent = `Ln ${cursor.line + 1}, Col ${cursor.ch + 1}`;
});

const savedText = localStorage.getItem('tako_txt_content');
if (savedText) {
  editor.innerText = savedText;
  cm.setValue(savedText);
}
updateStats();

const savedMode = localStorage.getItem('tako_txt_mode');
if (savedMode === 'code') setMode(true);

textModeBtn.addEventListener('click', () => setMode(false));
codeModeBtn.addEventListener('click', () => setMode(true));

function setMode(code) {
  isCodeMode = code;
  document.body.classList.toggle('code-mode', isCodeMode);
  textModeBtn.classList.toggle('active', !isCodeMode);
  codeModeBtn.classList.toggle('active', isCodeMode);
  
  if (isCodeMode) {
    if (cm.getValue() !== editor.innerText) {
      cm.setValue(editor.innerText);
    }
    cm.refresh();
    const cursor = cm.getCursor();
    posIndicator.textContent = `Ln ${cursor.line + 1}, Col ${cursor.ch + 1}`;
  } else {
    if (editor.innerText !== cm.getValue()) {
      editor.innerText = cm.getValue();
    }
    updateCursorPos();
  }
  localStorage.setItem('tako_txt_mode', isCodeMode ? 'code' : 'text');
  updateStats();
}

['input', 'keyup', 'mouseup', 'click', 'focus'].forEach(evt => {
  editor.addEventListener(evt, () => {
    if (isCodeMode) return;
    updateStats();
    updateCursorPos();
    if (evt === 'input') {
      localStorage.setItem('tako_txt_content', editor.innerText);
    }
  });
});

document.addEventListener('selectionchange', () => {
  if (!isCodeMode && document.activeElement === editor) {
    updateCursorPos();
  }
});

function updateStats() {
  const text = isCodeMode ? cm.getValue() : editor.innerText.trim();
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  charCount.textContent = `${chars} char${chars !== 1 ? 's' : ''}`;
  wordCount.textContent = `${words} word${words !== 1 ? 's' : ''}`;
}

function updateCursorPos() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  
  const textBefore = getTextBeforeRange(editor, range);
  const lines = textBefore.split('\n');
  const lineNum = lines.length;
  const colNum = lines[lines.length - 1].length + 1;
  posIndicator.textContent = `Ln ${lineNum}, Col ${colNum}`;
}

function getTextBeforeRange(container, range) {
  const preRange = range.cloneRange();
  preRange.selectNodeContents(container);
  preRange.setEnd(range.startContainer, range.startOffset);
  return preRange.toString();
}

themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  themeBtn.textContent = isDark ? 'Light' : 'Dark';
  cm.setOption('theme', isDark ? 'dracula' : 'default');
});

downloadBtn.addEventListener('click', () => {
  const text = isCodeMode ? cm.getValue() : editor.innerText;
  if (!text) return;
  const ext = isCodeMode ? (langSelector.value === 'cpp' ? 'cpp' : (langSelector.value === 'json' ? 'json' : (langSelector.value === 'python' ? 'py' : 'txt'))) : 'txt';
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `file-${new Date().toISOString().slice(0,10)}.${ext}`;
  a.click();
  URL.revokeObjectURL(url);
});

clearBtn.addEventListener('click', () => {
  if (confirm('Clear editor content?')) {
    editor.innerText = '';
    cm.setValue('');
    localStorage.removeItem('tako_txt_content');
    updateStats();
    if (isCodeMode) {
      const cursor = cm.getCursor();
      posIndicator.textContent = `Ln ${cursor.line + 1}, Col ${cursor.ch + 1}`;
    } else {
      updateCursorPos();
    }
  }
});

if (!isCodeMode) updateCursorPos();
</script>
</body>
</html>
