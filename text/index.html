<title>.Txt Editor | tako@sudokys</title>

<style>
:root {
  /* Catppuccin Latte (light) */
  --bg-color: #eff1f5;
  --card-bg: #e6e9ef;
  --text-color: #4c4f69;
  --muted-color: #8c8fa1;
  --border-color: #ccd0da;
  --accent-color: #40a02b;
  --font-family: Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'Outfit', sans-serif;
}
body.dark {
  /* Catppuccin Mocha (dark) */
  --bg-color: #030508;
  --card-bg: #080d16;
  --text-color: #cdd6f4;
  --muted-color: #6c7086;
  --border-color: rgba(0, 255, 163, 0.14);
  --accent-color: #00ffa3;
}
body.code-mode {
  --font-family: 'JetBrains Mono', monospace;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: var(--font-family);
  background: var(--bg-color);
  color: var(--text-color);
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: background 0.25s ease, color 0.25s ease;
}
header {
  padding: 0.8rem 1.5rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  background: var(--card-bg);
}
.brand {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 1.05rem;
  text-decoration: none;
  color: var(--text-color);
  letter-spacing: -0.3px;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.brand .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-color);
}
.controls {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
/* Minimal Buttons */
.btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted-color);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.35rem 0.65rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  letter-spacing: 0.5px;
}
.btn:hover {
  color: var(--text-color);
  background: rgba(128, 128, 128, 0.12);
  border-color: var(--border-color);
}
.btn.active {
  color: var(--accent-color);
}
.mode-toggle {
  background: rgba(128, 128, 128, 0.08);
  border: 1px solid var(--border-color);
  padding: 0.2rem;
  border-radius: 4px;
  display: flex;
  gap: 0.2rem;
}
.mode-btn {
  background: transparent;
  border: none;
  color: var(--muted-color);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  padding: 0.25rem 0.6rem;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.mode-btn.active {
  background: var(--accent-color);
  color: #030508;
  font-weight: 700;
}
.editor-container {
  flex-grow: 1;
  width: 88%;
  max-width: 850px;
  margin: 1.5rem auto;
  display: flex;
  flex-direction: column;
  position: relative;
}
#editor {
  flex-grow: 1;
  width: 100%;
  height: 100%;
  padding: 1rem 0;
  background: transparent;
  color: var(--text-color);
  border: none;
  outline: none;
  overflow-y: auto;
  line-height: 1.65;
  font-size: 1.12rem;
  font-family: var(--font-family);
  white-space: pre-wrap;
  word-break: break-word;
}
#editor:empty::before {
  content: attr(data-placeholder);
  color: var(--muted-color);
  pointer-events: none;
  opacity: 0.6;
}
body.code-mode #editor {
  display: none;
}
.lang-selector {
  display: none;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  color: var(--text-color);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  padding: 0.25rem 0.5rem;
  border-radius: 4px;
  outline: none;
}
body.code-mode .lang-selector {
  display: block;
}
.CodeMirror {
  display: none;
  height: 100%;
  font-family: var(--font-mono);
  font-size: 1.05rem;
  background: transparent !important;
}
body.code-mode .CodeMirror {
  display: block;
  flex-grow: 1;
}
.CodeMirror-hints {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  background: var(--bg-color) !important;
  border: 1px solid var(--border-color) !important;
  border-radius: 6px !important;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2) !important;
  padding: 4px 0 !important;
  color: var(--text-color) !important;
  overflow: hidden;
}
.CodeMirror-hint {
  padding: 6px 12px !important;
  color: var(--text-color) !important;
  border-radius: 0 !important;
  cursor: pointer;
}
.CodeMirror-hint-active {
  background: var(--accent-color) !important;
  color: #030508 !important;
  font-weight: 600;
}
body.dark .CodeMirror-hint-active {
  color: #030508 !important;
}
/* Theme Integration Overrides */
body.dark .CodeMirror-gutters {
  background: transparent !important;
  border-right: 1px solid var(--border-color) !important;
}
body.dark .CodeMirror-linenumber {
  color: var(--muted-color) !important;
}
body.dark .CodeMirror-cursor {
  border-left: 2px solid var(--accent-color) !important;
}
body.dark .CodeMirror-selected {
  background: rgba(0, 255, 163, 0.18) !important;
}
/* Syntax Highlighting — Catppuccin Mocha */
body.dark .cm-s-dracula.CodeMirror { background: transparent !important; color: #cdd6f4 !important; }
body.dark .cm-s-dracula .cm-variable { color: #cdd6f4 !important; }
body.dark .cm-s-dracula .cm-builtin { color: #89dceb !important; font-weight: 500; }
body.dark .cm-s-dracula .cm-keyword { color: #cba6f7 !important; font-weight: 600; }
body.dark .cm-s-dracula .cm-def { color: #89b4fa !important; }
body.dark .cm-s-dracula .cm-string { color: #00ffa3 !important; }
body.dark .cm-s-dracula .cm-number { color: #fab387 !important; }
body.dark .cm-s-dracula .cm-operator { color: #94e2d5 !important; }
body.dark .cm-s-dracula .cm-comment { color: #6c7086 !important; font-style: italic; }
body.dark .cm-s-dracula .cm-property { color: #74c7ec !important; }
body.dark .cm-s-dracula .cm-atom { color: #fab387 !important; }
body.dark .cm-s-dracula .cm-tag { color: #f38ba8 !important; }

/* Syntax Highlighting — Catppuccin Latte */
body:not(.dark) .cm-s-default.CodeMirror { background: transparent !important; color: #4c4f69 !important; }
body:not(.dark) .CodeMirror-gutters { background: transparent !important; border-right: 1px solid var(--border-color) !important; }
body:not(.dark) .CodeMirror-linenumber { color: var(--muted-color) !important; }
body:not(.dark) .cm-s-default .cm-variable { color: #4c4f69 !important; }
body:not(.dark) .cm-s-default .cm-builtin { color: #04a5e5 !important; font-weight: 500; }
body:not(.dark) .cm-s-default .cm-keyword { color: #8839ef !important; font-weight: 600; }
body:not(.dark) .cm-s-default .cm-def { color: #1e66f5 !important; }
body:not(.dark) .cm-s-default .cm-string { color: #40a02b !important; }
body:not(.dark) .cm-s-default .cm-number { color: #fe640b !important; }
body:not(.dark) .cm-s-default .cm-operator { color: #179299 !important; }
body:not(.dark) .cm-s-default .cm-comment { color: #8c8fa1 !important; font-style: italic; }
body:not(.dark) .cm-s-default .cm-property { color: #209fb5 !important; }
body:not(.dark) .cm-s-default .cm-tag { color: #d20f39 !important; }

footer {
  padding: 0.65rem 1.5rem;
  border-top: 1px solid var(--border-color);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--muted-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--card-bg);
}
.footer-left {
  display: flex;
  gap: 1.2rem;
  align-items: center;
}
.pos-indicator {
  color: var(--muted-color);
}
.code-indicator {
  display: none;
  color: var(--accent-color);
  font-size: 0.78rem;
  font-weight: 600;
}
body.code-mode .code-indicator {
  display: inline;
}
@media (max-width: 640px) {
  header, footer {
    padding: 0.6rem 1rem;
  }
  .editor-container {
    width: 92%;
    margin: 0.8rem auto;
  }
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/anyword-hint.min.js"></script>
</head>
<body class="dark">
<header>
  <a href="/" class="brand">
    <span class="dot"></span>
    <span>.Txt Editor</span>
  </a>
  <div class="controls">
    <div class="mode-toggle">
      <button class="mode-btn active" id="textModeBtn">Text</button>
      <button class="mode-btn" id="codeModeBtn">Code</button>
    </div>
    
    <select id="langSelector" class="lang-selector">
      <option value="python">Python</option>
    </select>
    
    <button class="btn" id="themeBtn" title="Toggle theme">Light</button>
    <button class="btn" id="downloadBtn" title="Save file">[SAVE]</button>
    <button class="btn" id="clearBtn" title="Clear text">[CLEAR]</button>
  </div>
</header>
<div class="editor-container">
  <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start typing your notes here...">The quick brown fox jumps over the lazy dog.</div>
  <textarea id="codeEditor"></textarea>
</div>
<footer>
  <div class="footer-left">
    <span class="pos-indicator" id="posIndicator">Ln 1, Col 1</span>
    <span id="charCount">0 chars</span>
    <span id="wordCount">0 words</span>
    <span class="code-indicator">&lt;/&gt;</span>
  </div>
  <div>Auto-saved</div>
</footer>
<script>
const editor = document.getElementById('editor');
const codeEditorTextarea = document.getElementById('codeEditor');
const langSelector = document.getElementById('langSelector');
const themeBtn = document.getElementById('themeBtn');
const textModeBtn = document.getElementById('textModeBtn');
const codeModeBtn = document.getElementById('codeModeBtn');
const downloadBtn = document.getElementById('downloadBtn');
const clearBtn = document.getElementById('clearBtn');
const posIndicator = document.getElementById('posIndicator');
const charCount = document.getElementById('charCount');
const wordCount = document.getElementById('wordCount');
let isCodeMode = false;
let isDark = true;

const cm = CodeMirror.fromTextArea(codeEditorTextarea, {
  lineNumbers: true,
  mode: 'python',
  theme: 'dracula',
  extraKeys: {"Ctrl-Space": "autocomplete"}
});
cm.on("inputRead", function(instance, change) {
  if (change.text[0].match(/\w/)) {
    cm.showHint({hint: CodeMirror.hint.anyword, completeSingle: false});
  }
});
cm.on('change', () => {
  if (!isCodeMode) return;
  const val = cm.getValue();
  localStorage.setItem('tako_txt_content', val);
  updateStats();
});
cm.on('cursorActivity', () => {
  if (!isCodeMode) return;
  const cursor = cm.getCursor();
  posIndicator.textContent = `Ln ${cursor.line + 1}, Col ${cursor.ch + 1}`;
});
const savedText = localStorage.getItem('tako_txt_content');
if (savedText) {
  editor.innerText = savedText;
  cm.setValue(savedText);
}
updateStats();
const savedMode = localStorage.getItem('tako_txt_mode');
if (savedMode === 'code') setMode(true);

textModeBtn.addEventListener('click', () => setMode(false));
codeModeBtn.addEventListener('click', () => setMode(true));
function setMode(code) {
  isCodeMode = code;
  document.body.classList.toggle('code-mode', isCodeMode);
  textModeBtn.classList.toggle('active', !isCodeMode);
  codeModeBtn.classList.toggle('active', isCodeMode);
  
  if (isCodeMode) {
    if (cm.getValue() !== editor.innerText) {
      cm.setValue(editor.innerText);
    }
    cm.refresh();
    const cursor = cm.getCursor();
    posIndicator.textContent = `Ln ${cursor.line + 1}, Col ${cursor.ch + 1}`;
  } else {
    if (editor.innerText !== cm.getValue()) {
      editor.innerText = cm.getValue();
    }
    updateCursorPos();
  }
  localStorage.setItem('tako_txt_mode', isCodeMode ? 'code' : 'text');
  updateStats();
}
['input', 'keyup', 'mouseup', 'click', 'focus'].forEach(evt => {
  editor.addEventListener(evt, () => {
    if (isCodeMode) return;
    updateStats();
    updateCursorPos();
    if (evt === 'input') {
      localStorage.setItem('tako_txt_content', editor.innerText);
    }
  });
});
document.addEventListener('selectionchange', () => {
  if (!isCodeMode && document.activeElement === editor) {
    updateCursorPos();
  }
});
function updateStats() {
  const text = isCodeMode ? cm.getValue() : editor.innerText.trim();
  const chars = text.length;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  charCount.textContent = `${chars} char${chars !== 1 ? 's' : ''}`;
  wordCount.textContent = `${words} word${words !== 1 ? 's' : ''}`;
}
function updateCursorPos() {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  
  const textBefore = getTextBeforeRange(editor, range);
  const lines = textBefore.split('\n');
  const lineNum = lines.length;
  const colNum = lines[lines.length - 1].length + 1;
  posIndicator.textContent = `Ln ${lineNum}, Col ${colNum}`;
}
function getTextBeforeRange(container, range) {
  const preRange = range.cloneRange();
  preRange.selectNodeContents(container);
  preRange.setEnd(range.startContainer, range.startOffset);
  return preRange.toString();
}
themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  themeBtn.textContent = isDark ? 'Light' : 'Dark';
  cm.setOption('theme', isDark ? 'dracula' : 'default');
});
downloadBtn.addEventListener('click', () => {
  const text = isCodeMode ? cm.getValue() : editor.innerText;
  if (!text) return;
  const ext = isCodeMode ? (langSelector.value === 'python' ? 'py' : 'txt') : 'txt';
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `file-${new Date().toISOString().slice(0,10)}.${ext}`;
  a.click();
  URL.revokeObjectURL(url);
});
clearBtn.addEventListener('click', () => {
  if (confirm('Clear editor content?')) {
    editor.innerText = '';
    cm.setValue('');
    localStorage.removeItem('tako_txt_content');
    updateStats();
    if (isCodeMode) {
      const cursor = cm.getCursor();
      posIndicator.textContent = `Ln ${cursor.line + 1}, Col ${cursor.ch + 1}`;
    } else {
      updateCursorPos();
    }
  }
});
if (!isCodeMode) updateCursorPos();
</script>
</body>
