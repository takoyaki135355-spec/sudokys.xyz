<title>.Txt | Minimal Notepad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">

<style>
:root {
  --bg-color: #ffffff;
  --text-color: #1e293b;
  --card-bg: #f8fafc;
  --border-color: #e2e8f0;
  --muted-color: #64748b;
  --accent-color: #00ffc3;
  --font-family: Georgia, 'Newsreader', serif;
}

body.dark {
  --bg-color: #0b0f17;
  --text-color: #e2ebf5;
  --card-bg: #111823;
  --border-color: rgba(255, 255, 255, 0.08);
  --muted-color: #64748b;
  --accent-color: #00ffc3;
}

body.mono {
  --font-family: 'JetBrains Mono', monospace;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-family);
  background: var(--bg-color);
  color: var(--text-color);
  display: flex;
  flex-direction: column;
  height: 100vh;
  transition: background 0.3s ease, color 0.3s ease;
}

header {
  padding: 1rem 2rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
}

.brand {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 1rem;
  text-decoration: none;
  color: var(--text-color);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.controls {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.btn {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  color: var(--text-color);
  padding: 0.4rem 0.75rem;
  border-radius: 6px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  transition: all 0.2s ease;
}

.btn:hover {
  border-color: var(--muted-color);
}

.editor-container {
  flex-grow: 1;
  max-width: 860px;
  width: 100%;
  margin: 0 auto;
  padding: 2rem;
  display: flex;
  flex-direction: column;
}

#editor {
  flex-grow: 1;
  width: 100%;
  padding: 1.5rem;
  border-radius: 8px;
  background: var(--card-bg);
  color: var(--text-color);
  border: 1px solid var(--border-color);
  outline: none;
  overflow-y: auto;
  line-height: 1.7;
  font-size: 1.1rem;
  font-family: var(--font-family);
  transition: background 0.3s, color 0.3s, border-color 0.3s;
}

#editor:empty::before {
  content: attr(data-placeholder);
  color: var(--muted-color);
}

footer {
  padding: 0.75rem 2rem;
  border-top: 1px solid var(--border-color);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--muted-color);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.stats {
  display: flex;
  gap: 1rem;
}

@media (max-width: 640px) {
  header, footer {
    padding: 0.75rem 1rem;
  }
  .editor-container {
    padding: 1rem;
  }
}
</style>
</head>
<body class="dark">

<header>
  <a href="/" class="brand">
    <span>.Txt</span>
    <span style="color: var(--muted-color); font-weight: 400; font-size: 0.8rem;">| takoyaki pad</span>
  </a>

  <div class="controls">
    <button class="btn" id="fontBtn">Font: Serif</button>
    <button class="btn" id="themeBtn">🌙 Dark</button>
    <button class="btn" id="downloadBtn">⬇️ Save .txt</button>
    <button class="btn" id="clearBtn">🗑️ Clear</button>
  </div>
</header>

<div class="editor-container">
  <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start typing your notes here..."></div>
</div>

<footer>
  <div class="stats">
    <span id="charCount">0 characters</span> ·
    <span id="wordCount">0 words</span>
  </div>
  <div>Auto-saved to browser storage</div>
</footer>

<script>
const editor = document.getElementById('editor');
const themeBtn = document.getElementById('themeBtn');
const fontBtn = document.getElementById('fontBtn');
const downloadBtn = document.getElementById('downloadBtn');
const clearBtn = document.getElementById('clearBtn');
const charCount = document.getElementById('charCount');
const wordCount = document.getElementById('wordCount');

// Load saved content
const savedText = localStorage.getItem('tako_txt_content');
if (savedText) {
  editor.innerText = savedText;
  updateStats();
}

// Auto save and stat update
editor.addEventListener('input', () => {
  localStorage.setItem('tako_txt_content', editor.innerText);
  updateStats();
});

function updateStats() {
  const text = editor.innerText.trim();
  const chars = editor.innerText.length;
  const words = text ? text.split(/\s+/).length : 0;
  charCount.textContent = `${chars} character${chars !== 1 ? 's' : ''}`;
  wordCount.textContent = `${words} word${words !== 1 ? 's' : ''}`;
}

// Theme toggle
let isDark = true;
themeBtn.addEventListener('click', () => {
  isDark = !isDark;
  document.body.classList.toggle('dark', isDark);
  themeBtn.textContent = isDark ? '🌙 Dark' : '☀️ Light';
});

// Font toggle
let isMono = false;
fontBtn.addEventListener('click', () => {
  isMono = !isMono;
  document.body.classList.toggle('mono', isMono);
  fontBtn.textContent = isMono ? 'Font: Mono' : 'Font: Serif';
});

// Download .txt
downloadBtn.addEventListener('click', () => {
  const text = editor.innerText;
  if (!text) return;
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `notes-${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
});

// Clear
clearBtn.addEventListener('click', () => {
  if (confirm('Clear editor content?')) {
    editor.innerText = '';
    localStorage.removeItem('tako_txt_content');
    updateStats();
  }
});
</script>

</body>
</html>
