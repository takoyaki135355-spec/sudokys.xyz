<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/admin/assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal | tako@sudokys</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">

<style>
:root {
    --bg: #fff2e7;
    --card: #fff9f4;
    --border: rgba(63, 34, 0, 0.15);
    --text: #3f2200;
    --text-dim: #7c5226;
    --danger: #d94025;
    --accent: #c8963e;
    --accent-glow: rgba(200, 150, 62, 0.25);
    --warning: #ffb300;
    --muted: #a08162;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'Outfit', sans-serif;
    --font-serif: 'Le Jour Serif', 'Bodoni Moda', 'Playfair Display', serif;
}

body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    position: relative;
    overflow: hidden;
}

.portal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.8rem;
    width: 100%;
    max-width: 540px;
    box-shadow: 0 20px 45px rgba(63, 34, 0, 0.08);
    position: relative;
    z-index: 10;
    transition: all 0.35s ease;
}

.portal-card.granted {
    border-color: rgba(200, 150, 62, 0.65);
    box-shadow: 0 20px 50px rgba(200, 150, 62, 0.2);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
    border-bottom: 1px solid rgba(63, 34, 0, 0.1);
    padding-bottom: 1rem;
}

.badge {
    font-size: 0.75rem;
    background: rgba(217, 64, 37, 0.12);
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 0.25rem 0.65rem;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
}

.badge.granted {
    background: rgba(200, 150, 62, 0.15);
    color: var(--accent);
    border-color: var(--accent);
}

.title {
    font-family: var(--font-serif);
    font-size: 1.35rem;
    color: var(--text);
    font-weight: 700;
}

.log-box {
    background: #fff2e7;
    border: 1px solid rgba(63, 34, 0, 0.12);
    border-radius: 6px;
    padding: 1.25rem;
    font-size: 0.88rem;
    min-height: 150px;
    max-height: 220px;
    margin-bottom: 1.5rem;
    overflow-y: auto;
    line-height: 1.5;
    font-family: var(--font-sans);
}

.line {
    margin-bottom: 0.45rem;
    word-break: break-all;
}

.line-danger { color: var(--danger); font-weight: 600; }
.line-success { color: var(--accent); font-weight: 700; }
.line-warn { color: var(--accent); font-weight: 600; }
.line-muted { color: var(--text-dim); }

.input-row {
    display: flex;
    gap: 0.6rem;
}

.input-field {
    flex-grow: 1;
    background: #fff2e7;
    border: 1px solid rgba(63, 34, 0, 0.15);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 0.92rem;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s ease;
}

.input-field:focus {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
}

.btn {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 0.75rem 1.25rem;
    border-radius: 6px;
    font-family: var(--font-sans);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.5px;
}

.btn:hover {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 15px var(--accent-glow);
}

.btn.granted {
    background: var(--accent);
    color: #fff;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    color: var(--text-dim);
    font-size: 0.88rem;
    text-decoration: none;
    transition: color 0.2s ease;
    font-weight: 600;
}

.back-link:hover {
    color: var(--accent);
}
</style>
</head>

<body>

<div class="portal-card" id="card">
    <div class="header">
        <div class="title">Security Portal</div>
        <div class="badge" id="badge">RESTRICTED</div>
    </div>

    <div class="log-box" id="log-box">
        <div class="line line-warn">[SYSTEM ALERT] Unauthorized access attempts are monitored and logged.</div>
        <div class="line line-muted">Gateway Node: admin.sudokys.xyz v3.1</div>
        <div class="line">Please enter administrator passkey to authenticate:</div>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="input-row">
            <input type="password" class="input-field" id="passkey" placeholder="Enter passkey or flag..." autocomplete="off" autofocus>
            <button type="submit" class="btn" id="sub-btn">AUTHENTICATE</button>
        </div>
    </form>

    <a href="/" class="back-link">&larr; Return to Public Main Site</a>
</div>

<script>
const logBox = document.getElementById('log-box');
const card = document.getElementById('card');
const badge = document.getElementById('badge');
const subBtn = document.getElementById('sub-btn');
const passkeyInput = document.getElementById('passkey');

const VALID_KEYS = ['Prince123233321'];

function appendLog(text, className = '') {
    const div = document.createElement('div');
    div.className = 'line ' + className;
    div.textContent = text;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

function handleAuth(e) {
    e.preventDefault();
    const val = passkeyInput.value.trim();
    if (!val) return;

    passkeyInput.value = '';
    appendLog(`> Authenticating target token: "${val.replace(/./g, '*')}"...`);

    setTimeout(() => {
        const lower = val.toLowerCase();
        if (VALID_KEYS.some(k => lower.includes(k))) {
            appendLog('[+] ACCESS GRANTED. Welcome back, Administrator Tako.', 'line-success');
            appendLog('[+] Session Token: 0x9f884a22b0a1d4ee', 'line-success');
            appendLog('[+] Flag verified! Good job hunter.', 'line-success');
            
            badge.textContent = 'AUTHENTICATED';
            badge.classList.add('granted');
            card.classList.add('granted');
            subBtn.classList.add('granted');
            subBtn.textContent = 'UNLOCKED';
        } else {
            appendLog('[-] ACCESS DENIED: Invalid Security Clearance.', 'line-danger');
            appendLog(`[-] Incident logged to /var/log/auth.log [${new Date().toISOString()}]`, 'line-muted');
        }
    }, 400);
}
</script>

</body>
</html>
