<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/admin/assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal | tako@sudokys</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">

<style>
:root {
    --bg: #0f0a08;
    --card: #1a120e;
    --border: rgba(212, 175, 55, 0.35);
    --text: #f5f0e6;
    --text-dim: #c5b299;
    --danger: #d94025;
    --accent: #d4af37;
    --accent-glow: rgba(212, 175, 55, 0.38);
    --warning: #ffb300;
    --muted: #7d6b58;
    --font-mono: 'JetBrains Mono', monospace;
    --font-sans: 'Outfit', sans-serif;
}

body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    position: relative;
    overflow: hidden;
}

.scanlines {
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
    background-size: 100% 4px;
    z-index: 2;
    pointer-events: none;
    opacity: 0.65;
}

.portal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.5rem;
    width: 100%;
    max-width: 540px;
    box-shadow: 0 0 35px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.6);
    position: relative;
    z-index: 10;
    transition: all 0.35s ease;
}

.portal-card.granted {
    border-color: rgba(212, 175, 55, 0.65);
    box-shadow: 0 0 45px rgba(212, 175, 55, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.6);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 1rem;
}

.badge {
    font-size: 0.75rem;
    background: rgba(217, 64, 37, 0.15);
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 0.25rem 0.65rem;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
}

.badge.granted {
    background: rgba(212, 175, 55, 0.18);
    color: var(--accent);
    border-color: var(--accent);
}

.title {
    font-family: var(--font-sans);
    font-size: 1.25rem;
    color: #fff;
    font-weight: 700;
}

.terminal-box {
    background: #090604;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    padding: 1.25rem;
    font-size: 0.85rem;
    min-height: 150px;
    max-height: 220px;
    margin-bottom: 1.5rem;
    overflow-y: auto;
    line-height: 1.5;
    font-family: var(--font-mono);
}

.line {
    margin-bottom: 0.45rem;
    word-break: break-all;
}

.line-danger { color: var(--danger); }
.line-success { color: var(--accent); }
.line-warn { color: var(--warning); }
.line-muted { color: var(--muted); }

.input-row {
    display: flex;
    gap: 0.6rem;
}

.input-field {
    flex-grow: 1;
    background: #090604;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    font-family: var(--font-mono);
    font-size: 0.9rem;
    padding: 0.75rem 1rem;
    border-radius: 4px;
    outline: none;
    transition: border-color 0.2s ease;
}

.input-field:focus {
    border-color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
}

.btn {
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 0.75rem 1.25rem;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.5px;
}

.btn:hover {
    opacity: 0.9;
    box-shadow: 0 0 15px rgba(217, 64, 37, 0.4);
}

.btn.granted {
    background: var(--accent);
    color: #0f0a08;
    box-shadow: 0 0 15px var(--accent-glow);
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    color: var(--text-dim);
    font-size: 0.85rem;
    text-decoration: none;
    transition: color 0.2s ease;
    font-weight: 600;
}

.back-link:hover {
    color: var(--accent);
}
</style>
</head>

<body>

<div class="scanlines"></div>

<div class="portal-card hud-corner" id="card">
    <div class="header">
        <div class="title glitch" data-text="tako-OS Security Portal">tako-OS Security Portal</div>
        <div class="badge" id="badge">RESTRICTED</div>
    </div>

    <div class="terminal-box" id="log-box">
        <div class="line line-warn">[SYSTEM ALERT] Unauthorized access attempts are monitored and logged.</div>
        <div class="line line-muted">Gateway Node: admin.sudokys.xyz v3.1</div>
        <div class="line">Please enter administrator passkey to authenticate:</div>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="input-row">
            <input type="password" class="input-field" id="passkey" placeholder="Enter passkey or flag..." autocomplete="off" autofocus>
            <button type="submit" class="btn" id="sub-btn">[AUTH]</button>
        </div>
    </form>

    <a href="/" class="back-link">&larr; Return to Public Main Site</a>
</div>

<script>
const logBox = document.getElementById('log-box');
const card = document.getElementById('card');
const badge = document.getElementById('badge');
const subBtn = document.getElementById('sub-btn');
const passkeyInput = document.getElementById('passkey');

const VALID_KEYS = ['Prince123233321'];

function playBeep(freq = 600, type = 'sine') {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
    } catch(e) {}
}

function appendLog(text, className = '') {
    const div = document.createElement('div');
    div.className = 'line ' + className;
    div.textContent = text;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

function handleAuth(e) {
    e.preventDefault();
    const val = passkeyInput.value.trim();
    if (!val) return;

    passkeyInput.value = '';
    playBeep(700);
    appendLog(`> AUTHENTICATING TARGET TOKEN: "${val.replace(/./g, '*')}"...`);

    setTimeout(() => {
        const lower = val.toLowerCase();
        if (VALID_KEYS.some(k => lower.includes(k))) {
            playBeep(1000, 'triangle');
            appendLog('[+] ACCESS GRANTED. Welcome back, Administrator Tako.', 'line-success');
            appendLog('[+] Session Token: 0x9f884a22b0a1d4ee', 'line-success');
            appendLog('[+] Flag verified! Good job hunter.', 'line-success');
            
            badge.textContent = 'AUTHENTICATED';
            badge.classList.add('granted');
            card.classList.add('granted');
            subBtn.classList.add('granted');
            subBtn.textContent = 'UNLOCKED';
        } else {
            playBeep(250, 'sawtooth');
            appendLog('[-] ACCESS DENIED: Invalid Security Clearance.', 'line-danger');
            appendLog(`[-] Incident logged to /var/log/auth.log [${new Date().toISOString()}]`, 'line-muted');
        }
    }, 400);
}
</script>

</body>
</html>
