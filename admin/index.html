<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/admin/assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal | tako@sudokys</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #05080c;
    --card: #0c121c;
    --border: rgba(255, 71, 87, 0.3);
    --text: #e2ebf5;
    --danger: #ff4757;
    --accent: #00ffc3;
    --warning: #ffa502;
    --muted: #475569;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "JetBrains Mono", monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
    position: relative;
    overflow: hidden;
}

/* Background scanlines */
body::before {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
    background-size: 100% 4px;
    z-index: 2;
    pointer-events: none;
    opacity: 0.6;
}

.portal-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2.5rem;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 0 30px rgba(255, 71, 87, 0.15), inset 0 0 15px rgba(0, 0, 0, 0.5);
    position: relative;
    z-index: 10;
    transition: all 0.3s ease;
}

.portal-card.granted {
    border-color: rgba(0, 255, 195, 0.4);
    box-shadow: 0 0 30px rgba(0, 255, 195, 0.2);
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 1rem;
}

.badge {
    font-size: 0.75rem;
    background: rgba(255, 71, 87, 0.15);
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.badge.granted {
    background: rgba(0, 255, 195, 0.15);
    color: var(--accent);
    border-color: var(--accent);
}

.title {
    font-size: 1.1rem;
    color: #fff;
    font-weight: 700;
}

.terminal-box {
    background: #06090f;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 1.25rem;
    font-size: 0.85rem;
    min-height: 140px;
    margin-bottom: 1.5rem;
    overflow-y: auto;
}

.line {
    margin-bottom: 0.4rem;
    word-break: break-all;
}

.line-danger { color: var(--danger); }
.line-success { color: var(--accent); }
.line-warn { color: var(--warning); }
.line-muted { color: var(--muted); }

.input-row {
    display: flex;
    gap: 0.5rem;
}

.input-field {
    flex-grow: 1;
    background: #06090f;
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.75rem 1rem;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s ease;
}

.input-field:focus {
    border-color: var(--accent);
}

.btn {
    background: var(--danger);
    color: #fff;
    border: none;
    padding: 0.75rem 1.25rem;
    border-radius: 6px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn:hover {
    opacity: 0.9;
    box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
}

.btn.granted {
    background: var(--accent);
    color: #000;
}

.back-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: none;
    transition: color 0.2s ease;
}

.back-link:hover {
    color: var(--accent);
}
</style>
</head>

<body>

<div class="portal-card" id="card">
    <div class="header">
        <div class="title">tako-OS Security Portal</div>
        <div class="badge" id="badge">RESTRICTED</div>
    </div>

    <div class="terminal-box" id="log-box">
        <div class="line line-warn">[SYSTEM ALERT] Unauthorized access attempts are monitored and logged.</div>
        <div class="line line-muted">Gateway Node: admin.sudokys.xyz v3.1</div>
        <div class="line">Please enter administrator passkey to authenticate:</div>
    </div>

    <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="input-row">
            <input type="password" class="input-field" id="passkey" placeholder="Enter passkey or flag..." autocomplete="off" autofocus>
            <button type="submit" class="btn" id="sub-btn">AUTH</button>
        </div>
    </form>

    <a href="/" class="back-link">&larr; Return to Public Main Site</a>
</div>

<script>
const logBox = document.getElementById('log-box');
const card = document.getElementById('card');
const badge = document.getElementById('badge');
const subBtn = document.getElementById('sub-btn');
const passkeyInput = document.getElementById('passkey');

const VALID_KEYS = ['tako', 'sudokys', 'c3ckk_5u', 'robot', 'admin'];

function appendLog(text, className = '') {
    const div = document.createElement('div');
    div.className = 'line ' + className;
    div.textContent = text;
    logBox.appendChild(div);
    logBox.scrollTop = logBox.scrollHeight;
}

function handleAuth(e) {
    e.preventDefault();
    const val = passkeyInput.value.trim();
    if (!val) return;

    passkeyInput.value = '';
    appendLog(`> AUTHENTICATING TARGET TOKEN: "${val.replace(/./g, '*')}"...`);

    setTimeout(() => {
        const lower = val.toLowerCase();
        if (VALID_KEYS.some(k => lower.includes(k))) {
            appendLog('[+] ACCESS GRANTED. Welcome back, Administrator Tako.', 'line-success');
            appendLog('[+] Session Token: 0x9f884a22b0a1d4ee', 'line-success');
            appendLog('[+] Flag verified! Good job hunter.', 'line-success');
            
            badge.textContent = 'AUTHENTICATED';
            badge.classList.add('granted');
            card.classList.add('granted');
            subBtn.classList.add('granted');
            subBtn.textContent = 'UNLOCKED';
        } else {
            appendLog('[-] ACCESS DENIED: Invalid Security Clearance.', 'line-danger');
            appendLog(`[-] Incident logged to /var/log/auth.log [${new Date().toISOString()}]`, 'line-muted');
        }
    }, 400);
}
</script>

</body>
</html>
