<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REFRACT | Laser Optics Puzzle | tako@sudokys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #fff2e7;
    font-family: 'Outfit', sans-serif;
    user-select: none; -webkit-user-select: none;
    color: #3f2200;
  }
  #c { position: fixed; inset: 0; display: block; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 32px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,242,231,0.92) 0%, rgba(255,242,231,0) 100%);
  }
  .hud-left {
    display: flex;
    align-items: center;
    gap: 1.4rem;
    pointer-events: all;
  }
  .home-link {
    color: #7c5226;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: 700;
    transition: color .15s;
  }
  .home-link:hover {
    color: #c8963e;
  }
  #lv {
    color: #c8963e;
    font-size: 12px; letter-spacing: 4px;
    font-weight: 800;
  }
  #rb {
    pointer-events: all; background: rgba(200, 150, 62, 0.14);
    border: 1px solid rgba(200, 150, 62, 0.35);
    color: #3f2200;
    font-family: inherit; font-size: 12px; letter-spacing: 2px;
    padding: 8px 20px; cursor: pointer; border-radius: 6px;
    transition: all .2s; font-weight: 700;
  }
  #rb:hover {
    background: #c8963e; color: #fff;
    box-shadow: 0 4px 16px rgba(200, 150, 62, 0.3);
  }

  #wo {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .45s ease;
    background: rgba(255, 242, 231, 0.85);
    backdrop-filter: blur(10px);
  }
  #wo.v { opacity: 1; }
  #wt {
    color: #3f2200;
    font-family: 'Bodoni Moda', 'Playfair Display', serif;
    font-size: 46px; font-weight: 800; letter-spacing: 12px;
    text-shadow: 0 0 25px rgba(200,150,62,0.4);
  }
  #ws {
    margin-top: 14px; font-size: 12px;
    letter-spacing: 5px; color: #7c5226;
    font-weight: 600;
  }

  #sig {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    color: rgba(63,34,0,0.3);
    font-size: 11px; letter-spacing: 8px;
    pointer-events: none; z-index: 5;
    font-weight: 700;
  }

  #hint {
    position: fixed; bottom: 48px; left: 50%;
    transform: translateX(-50%);
    color: rgba(200,150,62,0.85);
    font-size: 12px; letter-spacing: 3px;
    pointer-events: none; z-index: 5;
    transition: opacity 1s ease;
    font-weight: 700;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-left">
    <a href="/" class="home-link">&larr; MAIN SITE</a>
    <span id="lv">LEVEL 01</span>
  </div>
  <button id="rb">RESTART</button>
</div>

<div id="wo">
  <div id="wt">TARGET HIT</div>
  <div id="ws">LOADING NEXT LEVEL…</div>
</div>

<div id="sig">REFRACT // LASER OPTICS HUB</div>
<div id="hint">CLICK MIRRORS TO ROTATE</div>

<script>
'use strict';

const CELL     = 72;
const LASER_C  = '#c8963e';
const WIN_C    = '#3f2200';
const MIRROR_C = '#a08162';
const PI4      = Math.PI / 4;
const LERP     = 0.14;

const DIR_VEC = {
  right:[  1,  0 ],
  left: [ -1,  0 ],
  up:   [  0, -1 ],
  down: [  0,  1 ]
};

const BOUNCE = {
  0: { right:'up',   left:'down',  up:'right', down:'left'  },
  1: { right:'down', left:'up',    up:'left',  down:'right' }
};

function mRad(rot) { return rot === 0 ? -PI4 : PI4; }

const LEVELS = [
  {
    cols:8, rows:6,
    emitter:{ x:1, y:3, dir:'right' },
    mirrors:[ {x:5, y:3, rot:1} ],
    target:{ x:5, y:1 }
  },
  {
    cols:9, rows:7,
    emitter:{ x:1, y:5, dir:'right' },
    mirrors:[ {x:4,y:5,rot:1}, {x:4,y:2,rot:1} ],
    target:{ x:7, y:2 }
  },
  {
    cols:9, rows:8,
    emitter:{ x:1, y:5, dir:'right' },
    mirrors:[ {x:3,y:5,rot:1}, {x:3,y:2,rot:1}, {x:7,y:2,rot:0} ],
    target:{ x:7, y:5 }
  },
  {
    cols:10, rows:8,
    emitter:{ x:1, y:4, dir:'right' },
    mirrors:[
      {x:4,y:4,rot:1}, {x:4,y:1,rot:1},
      {x:7,y:4,rot:1}, {x:7,y:6,rot:0}
    ],
    target:{ x:8, y:1 }
  },
  {
    cols:9, rows:8,
    emitter:{ x:4, y:0, dir:'down' },
    mirrors:[
      {x:4,y:6,rot:1}, {x:1,y:6,rot:0},
      {x:1,y:3,rot:1}, {x:7,y:3,rot:1},
      {x:6,y:6,rot:0}
    ],
    target:{ x:7, y:6 }
  }
];

const canvas   = document.getElementById('c');
const ctx      = canvas.getContext('2d');

let W, H, offX, offY;
let lvIdx      = 0;
let mirrors    = [];
let laserPts   = [];
let laserHit   = false;
let won        = false;
let winTimer   = null;
let hoveredM   = null;
let particles  = [];
let flashAlpha = 0;
let dirty      = true;
let lastTime   = null;
let hintAlpha  = 1;
let hintTimer  = null;

function loadLevel(idx) {
  lvIdx = ((idx % LEVELS.length) + LEVELS.length) % LEVELS.length;
  const lv = LEVELS[lvIdx];

  mirrors = lv.mirrors.map(m => ({
    gx: m.x, gy: m.y,
    rot: m.rot,
    vis: mRad(m.rot),
    tgt: mRad(m.rot),
    lit: false
  }));

  won = laserHit = false; laserPts = [];
  document.getElementById('lv').textContent =
    'LEVEL ' + String(lvIdx + 1).padStart(2, '0');
  document.getElementById('wo').classList.remove('v');
  if (winTimer) { clearTimeout(winTimer); winTimer = null; }

  refreshDims();
  castLaser();
  dirty = true;
}

function castLaser() {
  const lv = LEVELS[lvIdx];
  let { x:px, y:py, dir } = lv.emitter;
  const pts = [{ gx:px, gy:py }];

  for (const m of mirrors) m.lit = false;

  for (let b = 0; b < 60; b++) {
    const [dx, dy] = DIR_VEC[dir];
    const nx = px + dx, ny = py + dy;

    if (nx < 0 || nx >= lv.cols || ny < 0 || ny >= lv.rows) {
      pts.push({ gx: nx, gy: ny }); break;
    }
    if (nx === lv.target.x && ny === lv.target.y) {
      pts.push({ gx: nx, gy: ny });
      laserPts = pts; laserHit = true;
      if (!won) { won = true; onWin(); }
      return;
    }
    const m = mirrors.find(m => m.gx === nx && m.gy === ny);
    if (m) {
      pts.push({ gx: nx, gy: ny });
      m.lit = true;
      dir = BOUNCE[m.rot][dir];
      px = nx; py = ny; continue;
    }
    px = nx; py = ny;
  }

  laserPts = pts; laserHit = false;
}

function onWin() {
  playWin(); spawnParticles(); flashAlpha = 0.18;
  const isLast = lvIdx === LEVELS.length - 1;
  document.getElementById('ws').textContent =
    isLast ? 'ALL LEVELS COMPLETE…' : 'LOADING NEXT LEVEL…';
  winTimer = setTimeout(() => {
    document.getElementById('wo').classList.add('v');
    winTimer = setTimeout(() => loadLevel(lvIdx + 1), 1800);
  }, 340);
}

function gp(gx, gy) {
  return [offX + gx * CELL + CELL * 0.5, offY + gy * CELL + CELL * 0.5];
}

function refreshDims() {
  W = canvas.width; H = canvas.height;
  const lv = LEVELS[lvIdx];
  offX = Math.round((W - lv.cols * CELL) * 0.5);
  offY = Math.round((H - lv.rows * CELL) * 0.5);
}

function drawBG() {
  ctx.save();
  ctx.fillStyle = '#fff2e7';
  ctx.fillRect(0, 0, W, H);

  const lv = LEVELS[lvIdx];

  ctx.strokeStyle = 'rgba(63,34,0,0.06)';
  ctx.lineWidth = 0.5;
  for (let c = 0; c <= lv.cols; c++) {
    ctx.beginPath();
    ctx.moveTo(offX + c * CELL, offY);
    ctx.lineTo(offX + c * CELL, offY + lv.rows * CELL);
    ctx.stroke();
  }
  for (let r = 0; r <= lv.rows; r++) {
    ctx.beginPath();
    ctx.moveTo(offX, offY + r * CELL);
    ctx.lineTo(offX + lv.cols * CELL, offY + r * CELL);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(63,34,0,0.12)';
  for (let c = 0; c <= lv.cols; c++) {
    for (let r = 0; r <= lv.rows; r++) {
      ctx.beginPath();
      ctx.arc(offX + c * CELL, offY + r * CELL, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawLaser() {
  if (laserPts.length < 2) return;
  ctx.save();
  const col = laserHit ? WIN_C : LASER_C;
  const pts = laserPts.map(p => gp(p.gx, p.gy));

  const layers = [
    { w: 24, a: 0.04 },
    { w: 10, a: 0.12 },
    { w:  4, a: 0.65 },
    { w:  1.5, a: 1.0 }
  ];

  for (const lyr of layers) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.strokeStyle = col;
    ctx.lineWidth   = lyr.w;
    ctx.globalAlpha = lyr.a;
    ctx.lineCap  = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (let i = 1; i < pts.length - 1; i++) {
    const [bx, by] = pts[i];
    const g = ctx.createRadialGradient(bx, by, 0, bx, by, 18);
    g.addColorStop(0, col + 'cc');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 0.65;
    ctx.beginPath();
    ctx.arc(bx, by, 18, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawEmitter() {
  const lv = LEVELS[lvIdx];
  const [px, py] = gp(lv.emitter.x, lv.emitter.y);
  ctx.save();
  ctx.translate(px, py);
  const s = 15;

  rrect(-s, -s, s*2, s*2, 4);
  ctx.fillStyle = '#fff9f4';
  ctx.fill();
  ctx.strokeStyle = 'rgba(63,34,0,0.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const b = 6;
  ctx.strokeStyle = LASER_C;
  ctx.lineWidth = 1.5;
  [ [-s,-s,1,1], [s,-s,-1,1], [s,s,-1,-1], [-s,s,1,-1] ].forEach(([x,y,sx,sy]) => {
    ctx.beginPath();
    ctx.moveTo(x, y + sy * b);
    ctx.lineTo(x, y);
    ctx.lineTo(x + sx * b, y);
    ctx.stroke();
  });

  const [dx, dy] = DIR_VEC[lv.emitter.dir];
  ctx.strokeStyle = LASER_C;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.65;
  ctx.beginPath();
  ctx.moveTo(dx * (s - 2), dy * (s - 2));
  ctx.lineTo(dx * (s + 13), dy * (s + 13));
  ctx.stroke();
  ctx.globalAlpha = 1;

  const tx = dx * (s + 13), ty = dy * (s + 13);
  const ng = ctx.createRadialGradient(tx, ty, 0, tx, ty, 9);
  ng.addColorStop(0, LASER_C + 'bb');
  ng.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(tx, ty, 9, 0, Math.PI * 2);
  ctx.fillStyle = ng;
  ctx.fill();

  ctx.restore();
}

function drawMirrors() {
  for (const m of mirrors) {
    const [px, py] = gp(m.gx, m.gy);
    const isHov = m === hoveredM && !won;
    const col   = isHov ? '#c8963e' : (m.lit ? '#3f2200' : MIRROR_C);
    const len   = 21;

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(m.vis);

    if (isHov) {
      const hg = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
      hg.addColorStop(0, 'rgba(200,150,62,0.2)');
      hg.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.arc(0, 0, 30, 0, Math.PI * 2);
      ctx.fillStyle = hg;
      ctx.fill();
    }

    ctx.strokeStyle = 'rgba(63,34,0,0.15)';
    ctx.lineWidth = 1;
    for (let t = -len + 5; t <= len; t += 9) {
      ctx.beginPath();
      ctx.moveTo(t, 0);
      ctx.lineTo(t - 5, 7);
      ctx.stroke();
    }

    ctx.shadowBlur  = isHov ? 15 : (m.lit ? 10 : 4);
    ctx.shadowColor = col;
    ctx.strokeStyle = col;
    ctx.lineWidth   = isHov ? 3 : 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-len, 0);
    ctx.lineTo( len, 0);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle  = col;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(-len, 0, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( len, 0, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.restore();
  }
}

function drawTarget() {
  const lv = LEVELS[lvIdx];
  const [px, py] = gp(lv.target.x, lv.target.y);
  const col   = laserHit ? WIN_C : 'rgba(200,150,62,0.7)';
  const col2  = laserHit ? WIN_C : 'rgba(200,150,62,0.35)';
  const R = 17;

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(Math.PI / 10);

  if (laserHit) {
    ctx.beginPath(); poly(0, 0, R + 8, 6);
    ctx.fillStyle = WIN_C + '1a'; ctx.fill();
    ctx.shadowBlur = 25; ctx.shadowColor = WIN_C;
  }

  ctx.beginPath(); poly(0, 0, R, 6);
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.beginPath(); poly(0, 0, R * 0.5, 6);
  ctx.strokeStyle = col2; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = col; ctx.fill();

  ctx.restore();
}

function drawParticles(dt) {
  ctx.save();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x  += p.vx * dt;
    p.y  += p.vy * dt;
    p.vy += 100 * dt;
    const a = (p.life / p.maxLife) * 0.9;
    ctx.globalAlpha = a;
    ctx.fillStyle   = WIN_C;
    const s = p.s * (p.life / p.maxLife);
    ctx.fillRect(p.x - s * 0.5, p.y - s * 0.5, s, s);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function spawnParticles() {
  const lv = LEVELS[lvIdx];
  const [px, py] = gp(lv.target.x, lv.target.y);
  for (let i = 0; i < 32; i++) {
    const a   = Math.random() * Math.PI * 2;
    const spd = 40 + Math.random() * 110;
    particles.push({
      x: px, y: py,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 55,
      s: 3 + Math.random() * 4.5,
      life: 0.5 + Math.random() * 0.75,
      maxLife: 1.25
    });
  }
}

function poly(cx, cy, r, n) {
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    if (i === 0) ctx.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    else         ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
  }
  ctx.closePath();
}

function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x+w, y,   x+w, y+r,   r);
  ctx.lineTo(x + w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r,y+h, r);
  ctx.lineTo(x + r, y+h);   ctx.arcTo(x,   y+h, x,   y+h-r, r);
  ctx.lineTo(x,     y+r);   ctx.arcTo(x,   y,   x+r, y,     r);
  ctx.closePath();
}

function frame(ts) {
  requestAnimationFrame(frame);
  const dt = lastTime ? Math.min((ts - lastTime) / 1000, 0.08) : 0;
  lastTime = ts;

  for (const m of mirrors) {
    const d = m.tgt - m.vis;
    if (Math.abs(d) > 0.0007) { m.vis += d * LERP; dirty = true; }
    else m.vis = m.tgt;
  }

  if (particles.length > 0 || flashAlpha > 0) dirty = true;
  if (!dirty) return;
  dirty = false;

  refreshDims();
  ctx.clearRect(0, 0, W, H);

  drawBG();
  drawLaser();
  drawTarget();
  drawEmitter();
  drawMirrors();
  drawParticles(dt);

  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(200,150,62,${flashAlpha.toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    flashAlpha = Math.max(0, flashAlpha - dt * 1.4);
  }
}

function getMirrorAt(mx, my) {
  for (const m of mirrors) {
    const [px, py] = gp(m.gx, m.gy);
    if (Math.hypot(mx - px, my - py) < CELL * 0.44) return m;
  }
  return null;
}

function doClick(mx, my) {
  if (won) return;
  const m = getMirrorAt(mx, my);
  if (!m) return;

  if (hintTimer === null) {
    hintTimer = 0;
    const h = document.getElementById('hint');
    h.style.opacity = '0';
    setTimeout(() => h.style.display = 'none', 1000);
  }

  m.rot = 1 - m.rot;
  m.tgt = mRad(m.rot);
  castLaser();
  dirty = true;
  playClick();
}

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  doClick(e.clientX - r.left, e.clientY - r.top);
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const t = e.touches[0];
  doClick(t.clientX - r.left, t.clientY - r.top);
}, { passive: false });

canvas.addEventListener('mousemove', e => {
  const r    = canvas.getBoundingClientRect();
  const prev = hoveredM;
  hoveredM   = won ? null : getMirrorAt(e.clientX - r.left, e.clientY - r.top);
  canvas.style.cursor = hoveredM ? 'pointer' : 'default';
  if (hoveredM !== prev) dirty = true;
});

canvas.addEventListener('mouseleave', () => {
  if (hoveredM) { hoveredM = null; dirty = true; }
});

document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') doRestart();
});

document.getElementById('rb').addEventListener('click', doRestart);

function doRestart() {
  if (winTimer) { clearTimeout(winTimer); winTimer = null; }
  particles = []; flashAlpha = 0;
  loadLevel(lvIdx);
}

function onResize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  dirty = true;
}
window.addEventListener('resize', onResize);
onResize();

let AC = null;
function ac() {
  if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  return AC;
}

function playClick() {
  try {
    const a = ac(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = 'square';
    o.frequency.setValueAtTime(700, t);
    o.frequency.exponentialRampToValueAtTime(330, t + 0.065);
    g.gain.setValueAtTime(0.10, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    o.start(t); o.stop(t + 0.08);
  } catch(_) {}
}

function playWin() {
  try {
    const a = ac();
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.type = 'sine'; o.frequency.value = f;
      const t = a.currentTime + i * 0.10;
      g.gain.setValueAtTime(0);
      g.gain.linearRampToValueAtTime(0.12, t + 0.025);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      o.start(t); o.stop(t + 0.6);
    });
  } catch(_) {}
}

loadLevel(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
